<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Anonymous Confessions | DSU KnotSpot</title>
    
    <!-- Typography & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        /* Confession-specific styles */
        .conf-feed {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 12px;
        }

        .conf-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            transition: all 0.22s ease;
            position: relative;
        }

        .conf-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: rgba(10, 74, 199, 0.1);
        }

        .conf-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .conf-author {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .conf-avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(10, 74, 199, 0.1);
        }

        .conf-avatar i {
            font-size: 14px;
        }

        .conf-author-name {
            font-size: 13.5px;
            font-weight: 800;
            color: var(--text-main);
        }

        .conf-time {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .conf-content {
            font-size: 14px;
            line-height: 1.6;
            color: #334155;
            margin-bottom: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .conf-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            padding-top: 12px;
        }

        .action-btn {
            border: none;
            background: var(--surface-muted);
            color: var(--text-muted);
            border-radius: 100px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .action-btn:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .action-btn.liked {
            background: #fff1f2;
            color: #f43f5e;
        }

        .action-btn.liked .material-symbols-rounded {
            font-variation-settings: 'FILL' 1;
        }

        /* Comment Bubble */
        .comment-item {
            padding: 12px 14px;
            background: var(--surface-muted);
            border-radius: 16px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .comment-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-weight: 700;
            color: var(--text-main);
        }

        .comment-item-time {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sticky Header -->
        <header class="feed-header">
            <div class="feed-header-main">
                <a href="../index.html" class="feed-header-icon" style="text-decoration: none;">
                    <span class="material-symbols-rounded">arrow_back</span>
                </a>
                <h1>Confessions</h1>
            </div>
            <div class="feed-header-icon">
                <i class="fas fa-mask" style="font-size: 18px;"></i>
            </div>
        </header>

        <!-- Segmented Campus Filter -->
        <div class="segmented-control">
            <button class="segmented-tab active" onclick="filterConfessions('all', this)">All Campuses</button>
            <button class="segmented-tab" onclick="filterConfessions('ks-layout', this)">KS Layout</button>
            <button class="segmented-tab" onclick="filterConfessions('kanakapura', this)">Kanakapura Rd</button>
        </div>

        <!-- Confessions Feed -->
        <div id="confessions-list" class="conf-feed">
            <!-- Dynamically populated by JS -->
        </div>

        <!-- FAB to post a confession -->
        <button class="fab-btn" onclick="openPostModal()">
            <span class="material-symbols-rounded">edit</span>
        </button>

        <!-- Bottom Navigation Bar Placeholder -->
        <nav id="global-nav"></nav>
    </div>

    <!-- Modals -->

    <!-- Write Confession Modal -->
    <div id="post-modal" class="modal-overlay" onclick="closePostModalOnOverlay(event)">
        <div class="modal-sheet">
            <div class="modal-header">
                <h3>Post a Confession</h3>
                <button type="button" class="modal-close-btn" onclick="closePostModal()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="confession-form" onsubmit="submitConfession(event)">
                    <label style="font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px;">Select Campus</label>
                    <select id="conf-campus" required>
                        <option value="ks-layout">KS Layout Campus</option>
                        <option value="kanakapura">Harohalli (Kanakapura) Campus</option>
                    </select>

                    <label style="font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px;">Your Confession</label>
                    <textarea id="conf-text" placeholder="Share your anonymous campus story..." rows="5" required style="resize: none;"></textarea>

                    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4;">
                        ⚠️ Please respect others. Do not post hate speech, harassment, or full personal names.
                    </p>

                    <button type="submit" class="btn-primary">
                        Post Anonymously
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Comments Modal -->
    <div id="comments-modal" class="modal-overlay" onclick="closeCommentsModalOnOverlay(event)">
        <div class="modal-sheet" style="max-height: 80vh;">
            <div class="modal-header">
                <h3>Confession Comments</h3>
                <button type="button" class="modal-close-btn" onclick="closeCommentsModal()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="modal-body" style="display: flex; flex-direction: column;">
                <div id="modal-confession-preview" style="padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; font-size: 14px; line-height: 1.5; color: var(--text-main);">
                    <!-- Confession snippet loaded dynamically -->
                </div>
                
                <div id="comments-list-container" style="flex: 1; min-height: 150px;">
                    <!-- Comment items loaded dynamically -->
                </div>

                <form id="comment-form" onsubmit="submitComment(event)" style="margin-top: 16px;">
                    <input type="hidden" id="modal-confession-id">
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="comment-text" placeholder="Add an anonymous reply..." required style="margin-bottom: 0; flex: 1;">
                        <button type="submit" class="btn-primary" style="width: auto; padding: 0 20px; height: 48px;">
                            <span class="material-symbols-rounded" style="margin: 0;">send</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Database and Global Scripts -->
    <script src="../static/js/db.js"></script>
    <script src="../static/js/app.js"></script>
    <script>
        let currentFilter = 'all';

        // Load Feed on page show
        document.addEventListener('DOMContentLoaded', () => {
            loadConfessions();
        });

        function filterConfessions(campus, btn) {
            currentFilter = campus;
            
            // Toggle active classes on tabs
            const tabs = btn.parentNode.querySelectorAll('.segmented-tab');
            tabs.forEach(t => t.classList.remove('active'));
            btn.classList.add('active');

            loadConfessions();
        }

        function loadConfessions() {
            const feedContainer = document.getElementById('confessions-list');
            feedContainer.innerHTML = '';

            const confessions = window.dsuDb.getConfessions();
            const user = window.dsuDb.getUser();
            const userEmail = user ? user.email : "guest";

            // Filter confessions by campus
            const filtered = confessions.filter(c => {
                if (currentFilter === 'all') return true;
                return c.campus === currentFilter;
            });

            if (filtered.length === 0) {
                feedContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <span class="material-symbols-rounded">visibility_off</span>
                        </div>
                        <h3>No Confessions Yet</h3>
                        <p>Be the first one to post a confession for this campus!</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(c => {
                const isLiked = c.likedBy && c.likedBy.includes(userEmail);
                const likedClass = isLiked ? 'liked' : '';
                const timeString = formatTime(c.createdAt);
                
                const card = document.createElement('div');
                card.className = 'conf-card';
                card.innerHTML = `
                    <div class="conf-card-header">
                        <div class="conf-author">
                            <div class="conf-avatar">
                                <i class="fas fa-mask"></i>
                            </div>
                            <div>
                                <div class="conf-author-name">${c.anonymousName || 'Anonymous Student'}</div>
                                <div class="conf-time">${timeString}</div>
                            </div>
                        </div>
                        <span class="pill-badge">${c.campus === 'ks-layout' ? 'KS Layout' : 'Harohalli'}</span>
                    </div>
                    <div class="conf-content">${escapeHTML(c.content)}</div>
                    <div class="conf-footer">
                        <button class="action-btn ${likedClass}" onclick="likeConfession('${c.id}', this)">
                            <span class="material-symbols-rounded" style="font-size:18px;">favorite</span>
                            <span>${c.likesCount || 0}</span>
                        </button>
                        <button class="action-btn" onclick="openCommentsModal('${c.id}')">
                            <span class="material-symbols-rounded" style="font-size:18px;">comment</span>
                            <span>${c.commentsCount || 0}</span>
                        </button>
                    </div>
                `;
                feedContainer.appendChild(card);
            });
        }

        // Like handler
        function likeConfession(id, btn) {
            const user = window.dsuDb.getUser();
            if (!user) {
                window.showToast("Please log in to like confessions.", "accent");
                return;
            }
            
            const updated = window.dsuDb.likeConfession(id);
            if (updated) {
                const countSpan = btn.querySelector('span:last-child');
                countSpan.textContent = updated.likesCount;
                
                const userEmail = user.email;
                if (updated.likedBy.includes(userEmail)) {
                    btn.classList.add('liked');
                } else {
                    btn.classList.remove('liked');
                }
            }
        }

        // Write Modal Actions
        function openPostModal() {
            if (!window.dsuDb.getUser()) {
                window.showToast("Please log in to write confessions.", "accent");
                return;
            }
            const modal = document.getElementById('post-modal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closePostModal() {
            const modal = document.getElementById('post-modal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
            document.getElementById('confession-form').reset();
        }

        function closePostModalOnOverlay(e) {
            if (e.target === document.getElementById('post-modal')) {
                closePostModal();
            }
        }

        function submitConfession(e) {
            e.preventDefault();
            const text = document.getElementById('conf-text').value.trim();
            const campus = document.getElementById('conf-campus').value;

            if (!text) return;

            window.dsuDb.createConfession(text, campus);
            closePostModal();
            window.showToast("Confession posted anonymously!");
            loadConfessions();
        }

        // Comments Modal Actions
        function openCommentsModal(confessionId) {
            const conf = window.dsuDb.getConfession(confessionId);
            if (!conf) return;

            document.getElementById('modal-confession-id').value = confessionId;
            document.getElementById('modal-confession-preview').innerHTML = `
                <strong style="color: var(--primary);">${conf.anonymousName || 'Anonymous Student'}:</strong>
                <p style="margin-top: 4px; font-style: italic;">"${escapeHTML(conf.content)}"</p>
            `;

            loadComments(confessionId);

            const modal = document.getElementById('comments-modal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeCommentsModal() {
            const modal = document.getElementById('comments-modal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
            document.getElementById('comment-form').reset();
        }

        function closeCommentsModalOnOverlay(e) {
            if (e.target === document.getElementById('comments-modal')) {
                closeCommentsModal();
            }
        }

        function loadComments(confessionId) {
            const container = document.getElementById('comments-list-container');
            container.innerHTML = '';

            const comments = window.dsuDb.getConfessionComments(confessionId);

            if (comments.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding: 20px 0;">
                        <p style="font-size: 13px; color: var(--text-muted);">No replies yet. Be the first to comment!</p>
                    </div>
                `;
                return;
            }

            comments.forEach(c => {
                const commentDiv = document.createElement('div');
                commentDiv.className = 'comment-item';
                commentDiv.innerHTML = `
                    <div class="comment-item-header">
                        <span>${c.authorName}</span>
                        <span class="comment-item-time">${formatTime(c.createdAt)}</span>
                    </div>
                    <div style="color: #475569; font-size:13.5px; line-height:1.4;">${escapeHTML(c.content)}</div>
                `;
                container.appendChild(commentDiv);
            });

            // Scroll container to bottom
            container.scrollTop = container.scrollHeight;
        }

        function submitComment(e) {
            e.preventDefault();
            const confessionId = document.getElementById('modal-confession-id').value;
            const text = document.getElementById('comment-text').value.trim();

            if (!text) return;
            if (!window.dsuDb.getUser()) {
                window.showToast("Please log in to add comments.", "accent");
                return;
            }

            window.dsuDb.addConfessionComment(confessionId, text);
            document.getElementById('comment-text').value = '';
            
            // Reload comments & parent feed updates
            loadComments(confessionId);
            loadConfessions();
        }

        // Helper Utilities
        function formatTime(isoString) {
            const date = new Date(isoString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);

            if (diffMins < 1) return 'just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
    </script>
</body>
</html>
