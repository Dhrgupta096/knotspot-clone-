<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Anonymous Confessions | DSU KnotSpot</title>
    
    <!-- Typography & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- Theme Controller (instant hydration) -->
    <script src="../static/js/theme.js"></script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        /* Confession-specific styles */
        .filter-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            margin-bottom: 16px;
            padding-bottom: 4px;
        }

        .filter-row::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            padding: 8px 16px;
            border-radius: 100px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 12.5px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-chip:hover, .filter-chip.active {
            background: var(--primary-soft);
            color: var(--primary);
            border-color: var(--primary-soft-border);
        }

        .conf-feed {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 12px;
        }

        .conf-card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            transition: all 0.22s ease;
            position: relative;
            overflow: visible;
        }

        .conf-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-soft-border);
        }

        .conf-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .conf-author {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .conf-avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(10, 74, 199, 0.15);
        }

        .conf-avatar i {
            font-size: 14px;
        }

        .conf-author-name {
            font-size: 13.5px;
            font-weight: 800;
            color: var(--text-main);
        }

        .conf-time {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .conf-content {
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .conf-footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .conf-reactions-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .reaction-btn {
            border: 1px solid var(--border);
            background: var(--surface-muted);
            color: var(--text-main);
            border-radius: 100px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            user-select: none;
            font-family: inherit;
        }

        .reaction-btn:hover {
            transform: translateY(-2px) scale(1.05);
            border-color: var(--primary-soft-border);
            background: var(--primary-soft);
        }

        .reaction-btn.active {
            background: var(--primary-soft);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
        }

        .reaction-btn:active {
            transform: scale(0.92);
        }

        .conf-action-links {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .action-btn {
            border: none;
            background: var(--surface-muted);
            color: var(--text-muted);
            border-radius: 100px;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .action-btn:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .emoji-pop {
            position: fixed;
            pointer-events: none;
            animation: floatUp 0.85s ease-out forwards;
            font-size: 24px;
            z-index: 9999;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.5); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.8); }
        }

        /* Comment Bubble */
        .comment-item {
            padding: 12px 14px;
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--text-main);
        }

        .comment-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-weight: 700;
            color: var(--text-main);
        }

        .comment-item-time {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sticky Header -->
        <header class="feed-header">
            <div class="feed-header-main">
                <a href="../index.html" class="feed-header-icon" style="text-decoration: none;">
                    <span class="material-symbols-rounded">arrow_back</span>
                </a>
                <h1>Confessions</h1>
            </div>
            <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
                <span class="material-symbols-rounded">dark_mode</span>
            </button>
        </header>

        <!-- Search Bar -->
        <div style="position: relative; height: 44px; margin-bottom: 12px;">
            <span class="material-symbols-outlined" style="position: absolute; left: 14px; top: 12px; color: var(--text-muted); font-size: 20px;">search</span>
            <input type="search" id="conf-search" placeholder="Search confessions..." oninput="searchConfessions(this.value)" style="padding-left: 44px; margin-bottom: 0; height: 44px; border-radius: 100px;">
        </div>

        <!-- Segmented Campus Filter -->
        <div class="segmented-control">
            <button class="segmented-tab active" onclick="filterConfessionsCampus('all', this)">All Campuses</button>
            <button class="segmented-tab" onclick="filterConfessionsCampus('ks-layout', this)">KS Layout</button>
            <button class="segmented-tab" onclick="filterConfessionsCampus('kanakapura', this)">Kanakapura Rd</button>
        </div>

        <!-- Category Chip Row -->
        <div class="filter-row">
            <button class="filter-chip active" onclick="filterConfessionsCategory('all', this)">All Topics</button>
            <button class="filter-chip" onclick="filterConfessionsCategory('Crushes', this)">Crushes ❤️</button>
            <button class="filter-chip" onclick="filterConfessionsCategory('Exams', this)">Exams & Stress 📚</button>
            <button class="filter-chip" onclick="filterConfessionsCategory('Hostel', this)">Hostel & Food 🍛</button>
            <button class="filter-chip" onclick="filterConfessionsCategory('Campus Life', this)">Campus Life 🏫</button>
            <button class="filter-chip" onclick="filterConfessionsCategory('Funny', this)">Funny 💀</button>
        </div>

        <!-- Community Guidelines & Safety Rules Notice -->
        <div style="display: flex; justify-content: space-between; align-items: center; background: var(--surface-muted); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 12px; margin-bottom: 12px; font-size: 12px;">
            <span style="display: flex; align-items: center; gap: 6px; color: var(--text-main); font-weight: 600;">
                <span class="material-symbols-rounded" style="font-size: 16px; color: #10b981;">shield</span>
                <span>100% Anonymous &amp; Moderated Feed</span>
            </span>
            <button type="button" onclick="window.moderationEngine.showGuidelinesModal()" style="background: none; border: none; color: var(--primary); font-weight: 700; cursor: pointer; text-decoration: underline; font-size: 11.5px;">
                Safety Rules 🛡️
            </button>
        </div>

        <!-- Confession Feed List Container -->
        <div id="confessions-list"></div>

        <!-- FAB to post a confession -->
        <button class="fab-btn" onclick="openPostModal()">
            <span class="material-symbols-rounded">edit</span>
        </button>

        <!-- Bottom Navigation Bar Placeholder -->
        <nav id="global-nav"></nav>
    </div>

    <!-- Modals -->

    <!-- Write Confession Modal -->
    <div id="post-modal" class="modal-overlay" onclick="closePostModalOnOverlay(event)">
        <div class="modal-sheet">
            <div class="modal-header">
                <h3>Post a Confession</h3>
                <button type="button" class="modal-close-btn" onclick="closePostModal()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="confession-form" onsubmit="submitConfession(event)">
                    <div style="display: flex; gap: 8px;">
                        <div style="flex: 1;">
                            <label style="font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px;">Campus</label>
                            <select id="conf-campus" required>
                                <option value="ks-layout">KS Layout</option>
                                <option value="kanakapura">Harohalli</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label style="font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px;">Category</label>
                            <select id="conf-category" required>
                                <option value="General">General</option>
                                <option value="Crushes">Crushes ❤️</option>
                                <option value="Exams">Exams 📚</option>
                                <option value="Hostel">Hostel 🍛</option>
                                <option value="Campus Life">Campus 🏫</option>
                                <option value="Funny">Funny 💀</option>
                            </select>
                        </div>
                    </div>

                    <label style="font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px;">Your Confession</label>
                    <textarea id="conf-text" placeholder="Share your anonymous campus story..." rows="5" required style="resize: none;"></textarea>

                    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4;">
                        ⚠️ Please respect others. Do not post hate speech, harassment, or full personal names.
                    </p>

                    <button type="submit" class="btn-primary">
                        Post Anonymously
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Comments Modal -->
    <div id="comments-modal" class="modal-overlay" onclick="closeCommentsModalOnOverlay(event)">
        <div class="modal-sheet" style="max-height: 80vh;">
            <div class="modal-header">
                <h3>Confession Replies</h3>
                <button type="button" class="modal-close-btn" onclick="closeCommentsModal()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="modal-body" style="display: flex; flex-direction: column;">
                <div id="modal-confession-preview" style="padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; font-size: 14px; line-height: 1.5; color: var(--text-main);">
                    <!-- Confession snippet loaded dynamically -->
                </div>
                
                <div id="comments-list-container" style="flex: 1; min-height: 150px;">
                    <!-- Comment items loaded dynamically -->
                </div>

                <form id="comment-form" onsubmit="submitComment(event)" style="margin-top: 16px;">
                    <input type="hidden" id="modal-confession-id">
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="comment-text" placeholder="Add an anonymous reply..." required style="margin-bottom: 0; flex: 1;">
                        <button type="submit" class="btn-primary" style="width: auto; padding: 0 20px; height: 48px;">
                            <span class="material-symbols-rounded" style="margin: 0;">send</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Database and Global Scripts -->
    <script src="../static/js/db.js"></script>
    <script src="../static/js/moderation.js"></script>
    <script src="../static/js/app.js"></script>
    <script>
        let currentCampus = 'all';
        let currentCategory = 'all';
        let searchQuery = '';

        const EMOJI_MAP = {
            heart: '❤️',
            fire: '🔥',
            skull: '💀',
            cry: '😭'
        };

        // Load Feed on page show
        document.addEventListener('DOMContentLoaded', () => {
            loadConfessions();
        });

        function filterConfessionsCampus(campus, btn) {
            currentCampus = campus;
            const tabs = btn.parentNode.querySelectorAll('.segmented-tab');
            tabs.forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            loadConfessions();
        }

        function filterConfessionsCategory(category, btn) {
            currentCategory = category;
            const chips = btn.parentNode.querySelectorAll('.filter-chip');
            chips.forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            loadConfessions();
        }

        function searchConfessions(query) {
            searchQuery = query.toLowerCase().trim();
            loadConfessions();
        }

        function loadConfessions() {
            const feedContainer = document.getElementById('confessions-list');
            feedContainer.innerHTML = '';

            const confessions = window.dsuDb.getConfessions();
            const user = window.dsuDb.getUser();
            const userEmail = user ? user.email : "guest";

            // Filter confessions
            const filtered = confessions.filter(c => {
                const matchesCampus = currentCampus === 'all' || c.campus === currentCampus;
                const matchesCategory = currentCategory === 'all' || c.category === currentCategory;
                const matchesSearch = !searchQuery || c.content.toLowerCase().includes(searchQuery) || (c.anonymousName && c.anonymousName.toLowerCase().includes(searchQuery));
                return matchesCampus && matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                feedContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <span class="material-symbols-rounded">visibility_off</span>
                        </div>
                        <h3>No Confessions Found</h3>
                        <p>No confessions match your filter or search query. Be the first to share one!</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(c => {
                const timeString = formatTime(c.createdAt);
                const reactions = c.reactions || { heart: c.likesCount || 0, fire: 0, skull: 0, cry: 0 };
                const userReaction = (c.userReactions && c.userReactions[userEmail]) || null;
                
                const card = document.createElement('div');
                card.className = 'conf-card';
                card.id = `conf-card-${c.id}`;
                card.innerHTML = `
                    <div class="conf-card-header">
                        <div class="conf-author">
                            <div class="conf-avatar">
                                <i class="fas fa-mask"></i>
                            </div>
                            <div>
                                <div class="conf-author-name">${c.anonymousName || 'Anonymous Student'}</div>
                                <div class="conf-time">${timeString}</div>
                            </div>
                        </div>
                        <div style="display: flex; gap: 6px; align-items: center;">
                            ${c.category && c.category !== 'General' ? `<span class="pill-badge accent">${escapeHTML(c.category)}</span>` : ''}
                            <span class="pill-badge">${c.campus === 'ks-layout' ? 'KS Layout' : 'Harohalli'}</span>
                        </div>
                    </div>
                    <div class="conf-content">${escapeHTML(c.content)}</div>
                    
                    <div class="conf-footer">
                        <!-- Multi-Reaction Bar -->
                        <div class="conf-reactions-bar">
                            <button type="button" class="reaction-btn ${userReaction === 'heart' ? 'active' : ''}" onclick="reactConfession('${c.id}', 'heart', event)">
                                <span>❤️</span>
                                <span>${reactions.heart || 0}</span>
                            </button>
                            <button type="button" class="reaction-btn ${userReaction === 'fire' ? 'active' : ''}" onclick="reactConfession('${c.id}', 'fire', event)">
                                <span>🔥</span>
                                <span>${reactions.fire || 0}</span>
                            </button>
                            <button type="button" class="reaction-btn ${userReaction === 'skull' ? 'active' : ''}" onclick="reactConfession('${c.id}', 'skull', event)">
                                <span>💀</span>
                                <span>${reactions.skull || 0}</span>
                            </button>
                            <button type="button" class="reaction-btn ${userReaction === 'cry' ? 'active' : ''}" onclick="reactConfession('${c.id}', 'cry', event)">
                                <span>😭</span>
                                <span>${reactions.cry || 0}</span>
                            </button>
                        </div>

                        <!-- Action Links (Replies, Share, and Report) -->
                        <div class="conf-action-links">
                            <button type="button" class="action-btn" onclick="openCommentsModal('${c.id}')">
                                <span class="material-symbols-rounded" style="font-size:18px;">chat_bubble_outline</span>
                                <span>${c.commentsCount || 0} Replies</span>
                            </button>

                            <button type="button" class="action-btn" onclick="shareConfession('${c.id}', '${escapeHTML(c.content.substring(0, 80)).replace(/'/g, "\\'")}')" title="Share Confession">
                                <span class="material-symbols-rounded" style="font-size:18px;">share</span>
                                <span>Share</span>
                            </button>

                            <button type="button" class="action-btn" onclick="window.moderationEngine.openReportModal('${c.id}', 'confession')" title="Report Confession" style="color: var(--text-muted);">
                                <span class="material-symbols-rounded" style="font-size:16px;">flag</span>
                                <span>Report</span>
                            </button>
                        </div>
                    </div>
                `;
                feedContainer.appendChild(card);
            });
        }

        // Reaction Handler with Animated Pop
        function reactConfession(id, reactionType, event) {
            const user = window.dsuDb.getUser();
            if (!user) {
                window.showToast("Please log in to react to confessions.", "accent");
                return;
            }
            
            // Pop float animation
            triggerEmojiPop(event, EMOJI_MAP[reactionType]);

            const updated = window.dsuDb.reactConfession(id, reactionType);
            if (updated) {
                // Smooth reload of confession card
                loadConfessions();
            }
        }

        function triggerEmojiPop(e, emoji) {
            const pop = document.createElement('div');
            pop.className = 'emoji-pop';
            pop.textContent = emoji;
            
            const rect = e.currentTarget.getBoundingClientRect();
            pop.style.left = `${rect.left + rect.width / 2 - 12}px`;
            pop.style.top = `${rect.top - 10}px`;
            
            document.body.appendChild(pop);
            pop.addEventListener('animationend', () => pop.remove());
        }

        // Share Confession
        function shareConfession(id, snippet) {
            const shareText = `🤫 DSU KnotSpot Confession:\n"${snippet}..."\n\nRead more at ${window.location.origin}/confessions/`;
            if (navigator.share) {
                navigator.share({
                    title: 'DSU KnotSpot Confession',
                    text: shareText,
                    url: window.location.href
                }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(shareText).then(() => {
                    window.showToast("Confession copied to clipboard!");
                }).catch(() => {
                    window.showToast("Link copied!");
                });
            } else {
                window.showToast("Sharing ready!");
            }
        }

        // Write Modal Actions
        function openPostModal() {
            if (!window.dsuDb.getUser()) {
                window.showToast("Please log in to write confessions.", "accent");
                return;
            }
            const modal = document.getElementById('post-modal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closePostModal() {
            const modal = document.getElementById('post-modal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
            document.getElementById('confession-form').reset();
        }

        function closePostModalOnOverlay(e) {
            if (e.target === document.getElementById('post-modal')) {
                closePostModal();
            }
        }

        function submitConfession(e) {
            e.preventDefault();
            const text = document.getElementById('conf-text').value.trim();
            const campus = document.getElementById('conf-campus').value;
            const category = document.getElementById('conf-category').value;

            if (!text) return;

            // Content Safety & Anti-Doxxing validation
            if (window.moderationEngine) {
                const check = window.moderationEngine.validateContent(text);
                if (!check.valid) {
                    window.showToast(check.reason, "accent");
                    return;
                }
            }

            window.dsuDb.createConfession(text, campus, category);
            closePostModal();
            window.showToast("Confession posted anonymously!");
            loadConfessions();
        }

        // Comments Modal Actions
        function openCommentsModal(confessionId) {
            const conf = window.dsuDb.getConfession(confessionId);
            if (!conf) return;

            document.getElementById('modal-confession-id').value = confessionId;
            document.getElementById('modal-confession-preview').innerHTML = `
                <strong style="color: var(--primary);">${conf.anonymousName || 'Anonymous Student'}:</strong>
                <p style="margin-top: 4px; font-style: italic;">"${escapeHTML(conf.content)}"</p>
            `;

            loadComments(confessionId);

            const modal = document.getElementById('comments-modal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeCommentsModal() {
            const modal = document.getElementById('comments-modal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
            document.getElementById('comment-form').reset();
        }

        function closeCommentsModalOnOverlay(e) {
            if (e.target === document.getElementById('comments-modal')) {
                closeCommentsModal();
            }
        }

        function loadComments(confessionId) {
            const container = document.getElementById('comments-list-container');
            container.innerHTML = '';

            const comments = window.dsuDb.getConfessionComments(confessionId);

            if (comments.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding: 20px 0;">
                        <p style="font-size: 13px; color: var(--text-muted);">No replies yet. Be the first to comment!</p>
                    </div>
                `;
                return;
            }

            comments.forEach(c => {
                const commentDiv = document.createElement('div');
                commentDiv.className = 'comment-item';
                commentDiv.innerHTML = `
                    <div class="comment-item-header">
                        <span>${c.authorName}</span>
                        <span class="comment-item-time">${formatTime(c.createdAt)}</span>
                    </div>
                    <div style="color: var(--text-main); font-size:13.5px; line-height:1.4;">${escapeHTML(c.content)}</div>
                `;
                container.appendChild(commentDiv);
            });

            container.scrollTop = container.scrollHeight;
        }

        function submitComment(e) {
            e.preventDefault();
            const confessionId = document.getElementById('modal-confession-id').value;
            const text = document.getElementById('comment-text').value.trim();

            if (!text) return;
            if (!window.dsuDb.getUser()) {
                window.showToast("Please log in to add comments.", "accent");
                return;
            }

            window.dsuDb.addConfessionComment(confessionId, text);
            document.getElementById('comment-text').value = '';
            
            // Reload comments & parent feed updates
            loadComments(confessionId);
            loadConfessions();
        }

        // Helper Utilities
        function formatTime(isoString) {
            const date = new Date(isoString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);

            if (diffMins < 1) return 'just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
    </script>
