<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DSU Events &amp; Fests | DSU KnotSpot</title>
    
    <!-- Typography & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        /* Events-specific styles */
        .events-feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 12px;
        }

        .event-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s ease;
        }

        .event-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: rgba(10, 74, 199, 0.1);
        }

        .event-banner-wrap {
            height: 180px;
            position: relative;
            background: var(--surface-muted);
        }

        .event-banner-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .event-rsvps-count {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(4px);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .event-body {
            padding: 20px;
        }

        .event-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.3;
            letter-spacing: -0.3px;
        }

        .event-desc {
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .event-details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            background: var(--surface-muted);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 18px;
        }

        .event-detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            color: var(--text-main);
            font-weight: 700;
        }

        .event-detail-item .material-symbols-rounded {
            font-size: 18px;
            color: var(--primary);
        }

        .event-footer {
            display: flex;
            justify-content: flex-end;
        }

        .rsvp-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            border: 1px solid var(--primary-soft-border);
        }

        .rsvp-btn.not-going {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(10, 74, 199, 0.15);
        }

        .rsvp-btn.going {
            background: #d1fae5;
            color: #065f46;
            border-color: rgba(6, 95, 70, 0.12);
        }

        .rsvp-btn.going .material-symbols-rounded {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sticky Header -->
        <header class="feed-header">
            <div class="feed-header-main">
                <a href="../index.html" class="feed-header-icon" style="text-decoration: none;">
                    <span class="material-symbols-rounded">arrow_back</span>
                </a>
                <h1>DSU Events</h1>
            </div>
            <div class="feed-header-icon">
                <span class="material-symbols-rounded">event</span>
            </div>
        </header>

        <!-- Segmented RSVP tab bar -->
        <div class="segmented-control">
            <button class="segmented-tab active" onclick="toggleEventsFilter('all', this)">All Events</button>
            <button class="segmented-tab" onclick="toggleEventsFilter('rsvped', this)">My RSVPs</button>
        </div>

        <!-- Events List -->
        <div id="events-list-container" class="events-feed">
            <!-- Loaded dynamically by JS -->
        </div>

        <!-- Bottom Navigation Bar Placeholder -->
        <nav id="global-nav"></nav>
    </div>

    <!-- Global Scripts -->
    <script src="../static/js/db.js"></script>
    <script src="../static/js/app.js"></script>
    <script>
        let eventFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            loadEvents();
        });

        function toggleEventsFilter(filter, btn) {
            eventFilter = filter;

            const tabs = btn.parentNode.querySelectorAll('.segmented-tab');
            tabs.forEach(t => t.classList.remove('active'));
            btn.classList.add('active');

            loadEvents();
        }

        function loadEvents() {
            const container = document.getElementById('events-list-container');
            container.innerHTML = '';

            const events = window.dsuDb.getEvents();

            // Filter
            const filtered = events.filter(e => {
                if (eventFilter === 'all') return true;
                return e.hasRsvp;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <span class="material-symbols-rounded">event</span>
                        </div>
                        <h3>No Events Found</h3>
                        <p>${eventFilter === 'rsvped' ? "You haven't registered interest in any DSU events yet!" : "No upcoming college events scheduled."}</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(e => {
                const card = document.createElement('div');
                card.className = 'event-card';

                const rsvpClass = e.hasRsvp ? 'going' : 'not-going';
                const rsvpText = e.hasRsvp ? 'Going' : 'RSVP';
                const rsvpIcon = e.hasRsvp ? 'check_circle' : 'event_available';

                card.innerHTML = `
                    <div class="event-banner-wrap">
                        <img src="${e.image}" alt="Event Banner">
                        <div class="event-rsvps-count">
                            <span class="material-symbols-rounded" style="font-size:14px; font-variation-settings:'FILL' 1;">groups</span>
                            <span>${e.rsvpsCount} attending</span>
                        </div>
                    </div>
                    <div class="event-body">
                        <h2 class="event-title">${escapeHTML(e.title)}</h2>
                        <p class="event-desc">${escapeHTML(e.description)}</p>
                        
                        <div class="events-details-grid">
                            <div class="event-detail-item">
                                <span class="material-symbols-rounded">calendar_month</span>
                                <span>${e.date}</span>
                            </div>
                            <div class="event-detail-item">
                                <span class="material-symbols-rounded">schedule</span>
                                <span>${e.time}</span>
                            </div>
                            <div class="event-detail-item" style="grid-column: span 2;">
                                <span class="material-symbols-rounded">location_on</span>
                                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px;">${e.venue}</span>
                            </div>
                        </div>

                        <div class="event-footer">
                            <button class="rsvp-btn ${rsvpClass}" onclick="handleRSVP('${e.id}', this)">
                                <span class="material-symbols-rounded" style="font-size:16px;">${rsvpIcon}</span>
                                <span>${rsvpText}</span>
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function handleRSVP(id, btn) {
            if (!window.dsuDb.getUser()) {
                window.showToast("Please log in to RSVP for events.", "accent");
                return;
            }

            const updated = window.dsuDb.rsvpEvent(id);
            if (updated) {
                if (updated.hasRsvp) {
                    window.showToast("You are registered! Event added to My RSVPs.");
                } else {
                    window.showToast("RSVP cancelled.");
                }
                loadEvents();
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
    </script>
</body>
</html>
