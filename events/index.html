<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DSU Events &amp; Fests | DSU KnotSpot</title>
    
    <!-- Typography & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- Theme Controller (instant hydration) -->
    <script src="../static/js/theme.js"></script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        /* Events-specific styles */
        .events-feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 12px;
        }

        .event-card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s ease;
        }

        .event-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-soft-border);
        }

        .event-banner-wrap {
            height: 190px;
            position: relative;
            background: var(--surface-muted);
            overflow: hidden;
        }

        .event-banner-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .event-card:hover .event-banner-wrap img {
            transform: scale(1.03);
        }

        .event-countdown-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .event-category-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--primary);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .event-rsvps-count {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .event-body {
            padding: 20px;
        }

        .event-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.3;
            letter-spacing: -0.3px;
        }

        .event-desc {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 16px;
        }

        .events-details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            background: var(--surface-muted);
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 18px;
        }

        .event-detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            color: var(--text-main);
            font-weight: 700;
        }

        .event-detail-item .material-symbols-rounded {
            font-size: 18px;
            color: var(--primary);
        }

        .event-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-top: 1px solid var(--border);
            padding-top: 14px;
            flex-wrap: wrap;
        }

        .calendar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-calendar {
            background: var(--surface-muted);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 100px;
            padding: 7px 12px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
            text-decoration: none;
            font-family: inherit;
        }

        .btn-calendar:hover {
            background: var(--primary-soft);
            color: var(--primary);
            border-color: var(--primary-soft-border);
        }

        .rsvp-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border-radius: 100px;
            font-size: 12.5px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            border: 1px solid var(--primary-soft-border);
        }

        .rsvp-btn.not-going {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(10, 74, 199, 0.2);
        }

        .rsvp-btn.not-going:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .rsvp-btn.going {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .rsvp-btn.going .material-symbols-rounded {
            font-variation-settings: 'FILL' 1;
        }

        .filter-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            margin-bottom: 12px;
            padding-bottom: 4px;
        }

        .filter-row::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            padding: 7px 14px;
            border-radius: 100px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-chip:hover, .filter-chip.active {
            background: var(--primary-soft);
            color: var(--primary);
            border-color: var(--primary-soft-border);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sticky Header -->
        <header class="feed-header">
            <div class="feed-header-main">
                <a href="../index.html" class="feed-header-icon" style="text-decoration: none;">
                    <span class="material-symbols-rounded">arrow_back</span>
                </a>
                <h1>DSU Events</h1>
            </div>
            <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
                <span class="material-symbols-rounded">dark_mode</span>
            </button>
        </header>

        <!-- Search Bar -->
        <div style="position: relative; height: 44px; margin-bottom: 10px;">
            <span class="material-symbols-outlined" style="position: absolute; left: 14px; top: 12px; color: var(--text-muted); font-size: 20px;">search</span>
            <input type="search" id="event-search" placeholder="Search events, workshops, fests..." oninput="searchEvents(this.value)" style="padding-left: 44px; margin-bottom: 0; height: 44px; border-radius: 100px;">
        </div>

        <!-- Segmented RSVP tab bar -->
        <div class="segmented-control" style="margin-bottom: 10px;">
            <button class="segmented-tab active" onclick="toggleEventsFilter('all', this)">All Events</button>
            <button class="segmented-tab" onclick="toggleEventsFilter('rsvped', this)">My RSVPs</button>
        </div>

        <!-- Category Filter Chips -->
        <div class="filter-row">
            <button class="filter-chip active" onclick="filterEventCategory('all', this)">All Categories</button>
            <button class="filter-chip" onclick="filterEventCategory('Cultural & Fests', this)">Cultural &amp; Fests 🎉</button>
            <button class="filter-chip" onclick="filterEventCategory('Hackathons', this)">Hackathons 💻</button>
            <button class="filter-chip" onclick="filterEventCategory('Workshops', this)">Workshops 🛠️</button>
            <button class="filter-chip" onclick="filterEventCategory('Sports', this)">Sports ⚽</button>
        </div>

        <!-- Events List -->
        <div id="events-list-container" class="events-feed">
            <!-- Loaded dynamically by JS -->
        </div>

        <!-- Bottom Navigation Bar Placeholder -->
        <nav id="global-nav"></nav>
    </div>

    <!-- Global Scripts -->
    <script src="../static/js/db.js"></script>
    <script src="../static/js/app.js"></script>
    <script>
        let eventFilter = 'all';
        let selectedCategory = 'all';
        let eventSearchQuery = '';

        document.addEventListener('DOMContentLoaded', () => {
            loadEvents();
        });

        function toggleEventsFilter(filter, btn) {
            eventFilter = filter;
            const tabs = btn.parentNode.querySelectorAll('.segmented-tab');
            tabs.forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            loadEvents();
        }

        function filterEventCategory(category, btn) {
            selectedCategory = category;
            const chips = btn.parentNode.querySelectorAll('.filter-chip');
            chips.forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            loadEvents();
        }

        function searchEvents(query) {
            eventSearchQuery = query.toLowerCase().trim();
            loadEvents();
        }

        // Live countdown string calculator
        function getEventCountdown(isoDate) {
            if (!isoDate) return '📅 Upcoming';
            const eventDate = new Date(isoDate);
            const now = new Date();
            const diffTime = eventDate - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) return '🏁 Completed';
            if (diffDays === 0) return '🔥 Today!';
            if (diffDays === 1) return '⚡ Tomorrow!';
            return `⏳ In ${diffDays} days`;
        }

        function loadEvents() {
            const container = document.getElementById('events-list-container');
            container.innerHTML = '';

            const events = window.dsuDb.getEvents();

            // Filter
            const filtered = events.filter(e => {
                const matchesRSVP = (eventFilter === 'all') || (e.hasRsvp);
                const matchesCat = (selectedCategory === 'all') || (e.category === selectedCategory);
                const matchesSearch = !eventSearchQuery ||
                                     e.title.toLowerCase().includes(eventSearchQuery) ||
                                     e.description.toLowerCase().includes(eventSearchQuery) ||
                                     e.venue.toLowerCase().includes(eventSearchQuery) ||
                                     e.date.toLowerCase().includes(eventSearchQuery);
                return matchesRSVP && matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <span class="material-symbols-rounded">event</span>
                        </div>
                        <h3>No Events Found</h3>
                        <p>${eventFilter === 'rsvped' ? "You haven't registered interest in any DSU events yet!" : "No upcoming college events match your filters."}</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(e => {
                const card = document.createElement('div');
                card.className = 'event-card';

                const rsvpClass = e.hasRsvp ? 'going' : 'not-going';
                const rsvpText = e.hasRsvp ? 'Going' : 'RSVP';
                const rsvpIcon = e.hasRsvp ? 'check_circle' : 'event_available';
                const countdown = getEventCountdown(e.isoDate);
                const category = e.category || 'Campus Event';

                card.innerHTML = `
                    <div class="event-banner-wrap">
                        <img src="${e.image}" alt="Event Banner" loading="lazy" decoding="async">
                        <div class="event-countdown-badge">
                            <span>${countdown}</span>
                        </div>
                        <div class="event-category-badge">
                            <span>${category}</span>
                        </div>
                        <div class="event-rsvps-count">
                            <span class="material-symbols-rounded" style="font-size:14px; font-variation-settings:'FILL' 1;">groups</span>
                            <span>${e.rsvpsCount} attending</span>
                        </div>
                    </div>
                    <div class="event-body">
                        <h2 class="event-title">${escapeHTML(e.title)}</h2>
                        <p class="event-desc">${escapeHTML(e.description)}</p>
                        
                        <div class="events-details-grid">
                            <div class="event-detail-item">
                                <span class="material-symbols-rounded">calendar_month</span>
                                <span>${e.date}</span>
                            </div>
                            <div class="event-detail-item">
                                <span class="material-symbols-rounded">schedule</span>
                                <span>${e.time}</span>
                            </div>
                            <div class="event-detail-item" style="grid-column: span 2;">
                                <span class="material-symbols-rounded">location_on</span>
                                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px;">${e.venue}</span>
                            </div>
                        </div>

                        <div class="event-footer">
                            <div class="calendar-actions">
                                <button type="button" class="btn-calendar" onclick="addToGoogleCalendar('${escapeHTML(e.title).replace(/'/g, "\\'")}', '${escapeHTML(e.description).replace(/'/g, "\\'")}', '${escapeHTML(e.venue).replace(/'/g, "\\'")}', '${e.isoDate || '2026-08-20T10:00:00'}')" title="Add to Google Calendar">
                                    <i class="fab fa-google" style="color:#ea4335;"></i>
                                    <span>Google Cal</span>
                                </button>
                                <button type="button" class="btn-calendar" onclick="downloadICS('${escapeHTML(e.title).replace(/'/g, "\\'")}', '${escapeHTML(e.description).replace(/'/g, "\\'")}', '${escapeHTML(e.venue).replace(/'/g, "\\'")}', '${e.isoDate || '2026-08-20T10:00:00'}')" title="Download Apple / Outlook .ics">
                                    <span class="material-symbols-rounded" style="font-size:14px;">download</span>
                                    <span>.ICS</span>
                                </button>
                                <button type="button" class="btn-calendar" onclick="shareEvent('${escapeHTML(e.title).replace(/'/g, "\\'")}', '${e.date}', '${escapeHTML(e.venue).replace(/'/g, "\\'")}')" title="Share Event">
                                    <span class="material-symbols-rounded" style="font-size:14px;">share</span>
                                </button>
                            </div>

                            <button class="rsvp-btn ${rsvpClass}" onclick="handleRSVP('${e.id}', this)">
                                <span class="material-symbols-rounded" style="font-size:16px;">${rsvpIcon}</span>
                                <span>${rsvpText}</span>
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Google Calendar Direct Sync Link
        function addToGoogleCalendar(title, desc, venue, isoDate) {
            const start = new Date(isoDate);
            const end = new Date(start.getTime() + (3 * 60 * 60 * 1000)); // Default 3 hours
            
            const formatGDate = d => d.toISOString().replace(/-|:|\.\d\d\d/g, '');
            const datesParam = `${formatGDate(start)}/${formatGDate(end)}`;
            
            const gUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${datesParam}&details=${encodeURIComponent(desc + "\n\nRSVP via DSU KnotSpot")}&location=${encodeURIComponent(venue)}`;
            
            window.open(gUrl, '_blank');
        }

        // 1-Click .ICS Calendar Download
        function downloadICS(title, desc, venue, isoDate) {
            const start = new Date(isoDate);
            const end = new Date(start.getTime() + (3 * 60 * 60 * 1000));
            const formatICSDate = d => d.toISOString().replace(/-|:|\.\d\d\d/g, '');

            const icsContent = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//DSU KnotSpot//Campus Events//EN',
                'BEGIN:VEVENT',
                `UID:dsu-event-${Date.now()}@knotspot.dsu.edu`,
                `DTSTAMP:${formatICSDate(new Date())}`,
                `DTSTART:${formatICSDate(start)}`,
                `DTEND:${formatICSDate(end)}`,
                `SUMMARY:${title}`,
                `DESCRIPTION:${desc}`,
                `LOCATION:${venue}`,
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', `${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.showToast("Calendar file (.ics) downloaded!");
        }

        // Share Event
        function shareEvent(title, date, venue) {
            const shareText = `🎉 DSU Campus Event: "${title}"\n📅 Date: ${date}\n📍 Venue: ${venue}\n\nJoin and RSVP on DSU KnotSpot: ${window.location.origin}/events/`;
            if (navigator.share) {
                navigator.share({
                    title: title,
                    text: shareText,
                    url: window.location.href
                }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(shareText).then(() => {
                    window.showToast("Event details copied to clipboard!");
                });
            } else {
                window.showToast("Share ready!");
            }
        }

        function handleRSVP(id, btn) {
            if (!window.dsuDb.getUser()) {
                window.showToast("Please log in to RSVP for events.", "accent");
                return;
            }

            const updated = window.dsuDb.rsvpEvent(id);
            if (updated) {
                if (updated.hasRsvp) {
                    window.showToast("You are registered! Event added to My RSVPs.");
                } else {
                    window.showToast("RSVP cancelled.");
                }
                loadEvents();
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
    </script>
</body>
</html>
